# Pixel Asset Forge example: "sporeling", a mushroom-creature enemy.
#
# Demonstrates the enemy workflow end to end: telegraph -> attack -> impact ->
# death with frame events, a mirrored direction (east <- west), and a bobbing cap
# driven by per-frame region offsets. The shadow region is never transformed, so
# the frame's lowest opaque row is constant and ANI001 (baseline stability) holds
# by construction rather than by luck.
schema_version: 1

asset:
  id: sporeling
  type: enemy
  canvas: [48, 48]
  perspective: three_quarter_top_down
  logical_pixel_scale: 1
  baseline_y: 43

palette:
  id: sporeling_palette
  # 8 of the 24-colour budget: one dominant cap colour that owns the silhouette
  # edge, a darker rim, a warm stem pair, spots, and two eye states.
  colors:
    - { id: shadow, hex: "#0a0a12" }
    - { id: cap_main, hex: "#b8443c" }
    - { id: cap_dark, hex: "#7a2a26" }
    - { id: spot, hex: "#f0e3d0" }
    - { id: stem, hex: "#d8cbb0" }
    - { id: stem_dark, hex: "#a89878" }
    - { id: eye, hex: "#2b1a1a" }
    - { id: eye_lit, hex: "#ffd24a" }

directions: [south, west, east]
# east is generated by mirroring west, never hand-authored.
mirror:
  east: west

anchors:
  feet: [24, 43]
  body: [24, 34]
  cap: [24, 24]

regions:
  # Flat ground shadow. Never moved by any transform, so it always supplies the
  # lowest opaque row (world y = 43) and pins the baseline.
  shadow:
    anchor: feet
    layer: 0
    shapes:
      - { op: ellipse, color: shadow, at: [-10, -2], size: [20, 3] }

  # Stem. Anchored to "body" rather than "feet" so it can squash during the
  # telegraph without disturbing the feet anchor that ANI002 watches.
  stem:
    anchor: body
    layer: 10
    shapes:
      - { op: rect, color: stem, at: [-5, -4], size: [10, 13] }
      # shading inset on the stem's own right side
      - { op: rect, color: stem_dark, at: [2, -3], size: [3, 11] }

  # Cap: the big read of the silhouette, one dominant colour.
  cap:
    anchor: cap
    layer: 20
    shapes:
      - { op: ellipse, color: cap_main, at: [-15, -8], size: [30, 17] }
      # underside rim, inset 2px horizontally from the cap ellipse so the accent
      # never reaches the outer silhouette edge
      - { op: rect, color: cap_dark, at: [-13, 5], size: [26, 4] }

  # Spots ride with the cap, each inset well inside the cap ellipse.
  spots:
    anchor: cap
    layer: 30
    shapes:
      - { op: ellipse, color: spot, at: [-10, -5], size: [6, 4] }
      - { op: ellipse, color: spot, at: [-1, -7], size: [7, 5] }
      - { op: ellipse, color: spot, at: [6, -4], size: [5, 4] }

  eyes:
    anchor: body
    layer: 40
    shapes:
      - { op: rect, color: eye, at: [-4, -1], size: [2, 3] }
      - { op: rect, color: eye, at: [2, -1], size: [2, 3] }

  # Angry glowing eyes: off by default, switched on for telegraph and attack.
  eyes_lit:
    anchor: body
    layer: 41
    shapes:
      - { op: rect, color: eye_lit, at: [-4, -1], size: [2, 3] }
      - { op: rect, color: eye_lit, at: [2, -1], size: [2, 3] }

direction_overrides:
  south: { eyes_lit: { visible: false } }
  west: { eyes_lit: { visible: false } }
  east: { eyes_lit: { visible: false } }

animations:
  # Gentle breathing bob: cap and spots rise 1px and settle.
  idle:
    loop: true
    frames:
      - { duration_ms: 200, transforms: { cap: { offset: [0, 0] }, spots: { offset: [0, 0] } } }
      - { duration_ms: 200, transforms: { cap: { offset: [0, -1] }, spots: { offset: [0, -1] } } }
      - { duration_ms: 200, transforms: { cap: { offset: [0, -1] }, spots: { offset: [0, -1] } } }
      - { duration_ms: 200, transforms: { cap: { offset: [0, 0] }, spots: { offset: [0, 0] } } }

  # Hopping shuffle: everything above the shadow lifts and lands. Vertical only,
  # so the frame's bbox centre-x never moves and ANI003 stays quiet.
  move:
    loop: true
    frames:
      - {
          duration_ms: 120,
          transforms:
            {
              cap: { offset: [0, 0] },
              spots: { offset: [0, 0] },
              stem: { offset: [0, 0] },
              eyes: { offset: [0, 0] },
            },
        }
      - {
          duration_ms: 120,
          transforms:
            {
              cap: { offset: [0, -2] },
              spots: { offset: [0, -2] },
              stem: { offset: [0, -1] },
              eyes: { offset: [0, -1] },
            },
        }
      - {
          duration_ms: 120,
          transforms:
            {
              cap: { offset: [0, -3] },
              spots: { offset: [0, -3] },
              stem: { offset: [0, -2] },
              eyes: { offset: [0, -2] },
            },
        }
      - {
          duration_ms: 120,
          transforms:
            {
              cap: { offset: [0, -1] },
              spots: { offset: [0, -1] },
              stem: { offset: [0, -1] },
              eyes: { offset: [0, -1] },
            },
        }

  # Wind-up. The cap flattens and widens and the eyes light: the fairness cue a
  # player reads before the hit lands.
  telegraph:
    loop: false
    frames:
      - {
          duration_ms: 140,
          events: [telegraph_start],
          transforms:
            {
              cap: { offset: [0, 1], scale_size: [2, 0] },
              spots: { offset: [0, 1] },
              eyes: { visible: false },
              eyes_lit: { visible: true },
            },
        }
      - {
          duration_ms: 140,
          transforms:
            {
              cap: { offset: [0, 2], scale_size: [4, -2] },
              spots: { offset: [0, 2] },
              eyes: { visible: false },
              eyes_lit: { visible: true },
            },
        }
      - {
          duration_ms: 160,
          transforms:
            {
              cap: { offset: [0, 2], scale_size: [4, -2] },
              spots: { offset: [0, 2] },
              eyes: { visible: false },
              eyes_lit: { visible: true },
            },
        }

  # Release: the cap snaps up and outward. Damage lands on frame 1.
  attack:
    loop: false
    frames:
      - {
          duration_ms: 90,
          transforms:
            {
              cap: { offset: [0, -2], scale_size: [2, 2] },
              spots: { offset: [0, -2] },
              eyes: { visible: false },
              eyes_lit: { visible: true },
            },
        }
      - {
          duration_ms: 90,
          events: [hitbox_on],
          transforms:
            {
              cap: { offset: [0, -4], scale_size: [6, 3] },
              spots: { offset: [0, -4] },
              eyes: { visible: false },
              eyes_lit: { visible: true },
            },
        }
      - {
          duration_ms: 120,
          events: [hitbox_off],
          transforms:
            {
              cap: { offset: [0, -1] },
              spots: { offset: [0, -1] },
              eyes: { visible: false },
              eyes_lit: { visible: true },
            },
        }

  # Hurt reaction: the cap squashes down hard, then partly recovers.
  impact:
    loop: false
    frames:
      - {
          duration_ms: 80,
          events: [hurt],
          transforms:
            { cap: { offset: [0, 3], scale_size: [4, -3] }, spots: { offset: [0, 3] } },
        }
      - {
          duration_ms: 120,
          transforms:
            { cap: { offset: [0, 1], scale_size: [2, -1] }, spots: { offset: [0, 1] } },
        }

  # Death: the cap collapses onto the stem and the eyes go out. The shadow stays,
  # so the final frame is neither empty (PIX008) nor off-baseline (ANI001).
  #
  # Note the shrink limits: the cap_dark rim is 4px tall, so a scale_size of
  # -4 or worse on y would collapse it below 1px and the renderer would refuse.
  death:
    loop: false
    frames:
      - {
          duration_ms: 100,
          transforms:
            { cap: { offset: [0, 2], scale_size: [2, -3] }, spots: { offset: [0, 2] } },
        }
      - {
          duration_ms: 120,
          transforms:
            {
              cap: { offset: [0, 5], scale_size: [-4, -3] },
              spots: { visible: false },
              eyes: { visible: false },
            },
        }
      - {
          duration_ms: 140,
          transforms:
            {
              cap: { offset: [0, 8], scale_size: [-10, -3] },
              spots: { visible: false },
              eyes: { visible: false },
              # shrink rather than offset: offsetting the stem down here would
              # push it below the shadow and break the declared baseline
              stem: { scale_size: [0, -6] },
            },
        }
      - {
          duration_ms: 200,
          events: [death_complete],
          transforms:
            {
              cap: { visible: false },
              spots: { visible: false },
              eyes: { visible: false },
              stem: { visible: false },
            },
        }

combat:
  telegraph_animation: telegraph
  death_animation: death
  hit_frames:
    attack: [1]

export:
  preview_format: gif
  preview_loop: true

validation:
  palette_limit: 24
  require_stable_baseline: true
  require_stable_anchors: true
  allow_antialiasing: false
